[project]
name = "shopping-agent"
version = "0.1.0"
description = "Cross-platform conversational shopping agent"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "langgraph>=0.2,<2",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
production = [
  "faiss-cpu>=1.8,<2",
  "opensearch-py>=2.6,<4",
  "redis>=5,<7",
]
test = [
  "httpx2>=2.7,<3",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff==0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
