apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-agent
  labels:
    app.kubernetes.io/name: shopping-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shopping-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopping-agent
    spec:
      terminationGracePeriodSeconds: 300
      containers:
        - name: shopping-agent
          image: shopping-agent/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: shopping-agent-secrets
            - configMapRef:
                name: shopping-agent-config
          readinessProbe:
            httpGet:
              path: /api/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: output
              mountPath: /app/output
            - name: uploaded
              mountPath: /app/uploaded
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: output
          emptyDir: {}
        - name: uploaded
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: shopping-agent-data
