name: shopping-agent

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-shopping_agent}"
      POSTGRES_USER: "${POSTGRES_USER:-shopping_agent}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-shopping_agent_dev}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-shopping-agent.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - shopping_agent

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - shopping_agent

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      # The local Compose profile disables the security plugin and therefore
      # must opt out of the image's demo-security bootstrap script explicitly.
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
      - "127.0.0.1:${OPENSEARCH_METRICS_PORT:-9600}:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --silent --fail 'http://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null || exit 1"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - shopping_agent

  opensearch-init:
    profiles: ["bootstrap"]
    image: curlimages/curl:8.10.1
    restart: "no"
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_CATEGORY_INDEX: "${OPENSEARCH_CATEGORY_INDEX:-shopping_agent_category_kb}"
      OPENSEARCH_SEARCH_PIPELINE: "${OPENSEARCH_SEARCH_PIPELINE:-shopping-agent-hybrid-pipeline}"
      OPENSEARCH_PRODUCT_SEARCH_PIPELINE: "${OPENSEARCH_PRODUCT_SEARCH_PIPELINE:-shopping-agent-product-hybrid-pipeline}"
    volumes:
      - ./docker/opensearch:/config:ro
    entrypoint: ["/bin/sh", "/config/bootstrap.sh"]
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - shopping_agent

  embedding:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/embedding.Dockerfile
    restart: unless-stopped
    environment:
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}"
      EMBEDDING_MODEL_PATH: "${EMBEDDING_MODEL_PATH:-}"
      EMBEDDING_DEVICE: "${EMBEDDING_DEVICE:-cpu}"
      EMBEDDING_DIMENSION: "${EMBEDDING_DIMENSION:-384}"
      EMBEDDING_MAX_BATCH: "${EMBEDDING_MAX_BATCH:-64}"
      HF_HOME: /models/huggingface
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-8090}:8090"
    volumes:
      - embedding_models:/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8090/health', timeout=8)); raise SystemExit(0 if data.get('status') == 'ok' else 1)"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - shopping_agent

  reranker-cpu:
    profiles: ["reranker"]
    build:
      context: .
      dockerfile: docker/reranker.Dockerfile
    restart: unless-stopped
    environment:
      RERANKER_MODEL: "${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}"
      RERANKER_DEVICE: "${RERANKER_DEVICE:-cpu}"
      RERANKER_MAX_LENGTH: "${RERANKER_MAX_LENGTH:-512}"
      RERANKER_BATCH_SIZE: "${RERANKER_BATCH_SIZE:-16}"
      HF_HOME: /models/huggingface
    ports:
      - "127.0.0.1:${RERANKER_PORT:-8091}:8091"
    volumes:
      - reranker_models:/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8091/health', timeout=8)); raise SystemExit(0 if data.get('status') == 'ok' else 1)"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - shopping_agent

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: "${APP_ENV:-development}"
      AGENT_MODE: "${AGENT_MODE:-auto}"
      SANDBOX_MODE: "${SANDBOX_MODE:-false}"
      ALLOW_FIXTURE_FALLBACK: "${ALLOW_FIXTURE_FALLBACK:-false}"
      DEVELOPER_DIAGNOSTIC_MODE: "${DEVELOPER_DIAGNOSTIC_MODE:-false}"
      ALLOW_RULES_FALLBACK: "${ALLOW_RULES_FALLBACK:-true}"
      STORE_BACKEND: "${STORE_BACKEND:-postgres}"
      STORE_REDIS_URL: "${COMPOSE_STORE_REDIS_URL:-redis://redis:6379/2}"
      STORE_POSTGRES_URL: "${COMPOSE_STORE_POSTGRES_URL:-postgresql://shopping_agent:shopping_agent_dev@postgres:5432/shopping_agent}"
      PRODUCT_CATALOG_BACKEND: "${PRODUCT_CATALOG_BACKEND:-disabled}"
      PRODUCT_CATALOG_INDEX_DIR: "${COMPOSE_PRODUCT_CATALOG_INDEX_DIR:-/app/data/product_index/electronics-hash}"
      PRODUCT_SEARCH_BACKEND: "${PRODUCT_SEARCH_BACKEND:-disabled}"
      PRODUCT_SEARCH_MARKETPLACES: "${PRODUCT_SEARCH_MARKETPLACES:-amazon,ebay}"
      PRODUCT_SEARCH_ALLOW_HISTORICAL: "${PRODUCT_SEARCH_ALLOW_HISTORICAL:-false}"
      PRODUCT_SEARCH_EMBEDDING_DIMENSION: "${PRODUCT_SEARCH_EMBEDDING_DIMENSION:-384}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}"
      EMBEDDING_MODEL_PATH: "${EMBEDDING_MODEL_PATH:-}"
      EMBEDDING_DEVICE: "${EMBEDDING_DEVICE:-cpu}"
      EMBEDDING_DIMENSION: "${EMBEDDING_DIMENSION:-384}"
      EMBEDDING_MAX_BATCH: "${EMBEDDING_MAX_BATCH:-64}"
      OPENSEARCH_URL: "${COMPOSE_OPENSEARCH_URL:-http://opensearch:9200}"
      OPENSEARCH_USERNAME: "${OPENSEARCH_USERNAME:-}"
      OPENSEARCH_PASSWORD: "${OPENSEARCH_PASSWORD:-}"
      OPENSEARCH_CATEGORY_INDEX: "${OPENSEARCH_CATEGORY_INDEX:-shopping_agent_category_kb}"
      OPENSEARCH_SEARCH_PIPELINE: "${OPENSEARCH_SEARCH_PIPELINE:-shopping-agent-hybrid-pipeline}"
      OPENSEARCH_PRODUCT_INDEX: "${OPENSEARCH_PRODUCT_INDEX:-shopping_agent_products}"
      OPENSEARCH_PRODUCT_SEARCH_PIPELINE: "${OPENSEARCH_PRODUCT_SEARCH_PIPELINE:-shopping-agent-product-hybrid-pipeline}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      LLM_MAIN: "${LLM_MAIN:-qwen3-30b-a3b-instruct}"
      LLM_LITE: "${LLM_LITE:-}"
      LLM_MINIMAL: "${LLM_MINIMAL:-}"
      LLM_FALLBACK: "${LLM_FALLBACK:-}"
      LLM_REASONING_EFFORT: "${LLM_REASONING_EFFORT:-}"
      LLM_WIRE_API: "${LLM_WIRE_API:-chat_completions}"
      LLM_RESPONSE_STORAGE: "${LLM_RESPONSE_STORAGE:-true}"
      PROMPT_VERSION_DIR: "${PROMPT_VERSION_DIR:-/app/data/prompt_versions}"
      SHOPPING_SKILLS_DIR: "${SHOPPING_SKILLS_DIR:-/app/app/skills}"
      # Preferred channel variables are credentials for licensed data-provider
      # marketplace channels, not official marketplace API credentials.
      AMAZON_DATA_PROVIDER: "${AMAZON_DATA_PROVIDER:-}"
      AMAZON_DATA_CHANNEL_ENDPOINT: "${AMAZON_DATA_CHANNEL_ENDPOINT:-}"
      AMAZON_DATA_CHANNEL_CREDENTIAL: "${AMAZON_DATA_CHANNEL_CREDENTIAL:-}"
      SHOPEE_DATA_PROVIDER: "${SHOPEE_DATA_PROVIDER:-}"
      SHOPEE_DATA_CHANNEL_ENDPOINT: "${SHOPEE_DATA_CHANNEL_ENDPOINT:-}"
      SHOPEE_DATA_CHANNEL_CREDENTIAL: "${SHOPEE_DATA_CHANNEL_CREDENTIAL:-}"
      ALIEXPRESS_DATA_PROVIDER: "${ALIEXPRESS_DATA_PROVIDER:-}"
      ALIEXPRESS_DATA_CHANNEL_ENDPOINT: "${ALIEXPRESS_DATA_CHANNEL_ENDPOINT:-}"
      ALIEXPRESS_DATA_CHANNEL_CREDENTIAL: "${ALIEXPRESS_DATA_CHANNEL_CREDENTIAL:-}"
      EBAY_DATA_PROVIDER: "${EBAY_DATA_PROVIDER:-}"
      EBAY_DATA_CHANNEL_ENDPOINT: "${EBAY_DATA_CHANNEL_ENDPOINT:-}"
      EBAY_DATA_CHANNEL_CREDENTIAL: "${EBAY_DATA_CHANNEL_CREDENTIAL:-}"
      EBAY_ENV: "${EBAY_ENV:-production}"
      EBAY_CLIENT_ID: "${EBAY_CLIENT_ID:-}"
      EBAY_CLIENT_SECRET: "${EBAY_CLIENT_SECRET:-}"
      EBAY_DEV_ID: "${EBAY_DEV_ID:-}"
      EBAY_MARKETPLACE_ID: "${EBAY_MARKETPLACE_ID:-EBAY_US}"
      EBAY_OAUTH_SCOPE: "${EBAY_OAUTH_SCOPE:-https://api.ebay.com/oauth/api_scope}"
      EBAY_DESTINATION_COUNTRY: "${EBAY_DESTINATION_COUNTRY:-CN}"
      EBAY_DESTINATION_POSTAL_CODE: "${EBAY_DESTINATION_POSTAL_CODE:-100000}"
      EBAY_SNAPSHOT_MANIFEST: "${EBAY_SNAPSHOT_MANIFEST:-/app/data/ebay_snapshots/browse-manifest.json}"
      CUSTOMS_AUTO_LOOKUP: "${CUSTOMS_AUTO_LOOKUP:-false}"
      CUSTOMS_IMPORT_REGIME: "${CUSTOMS_IMPORT_REGIME:-}"
      CUSTOMS_RATE_TYPE: "${CUSTOMS_RATE_TYPE:-auto}"
      CHINA_CUSTOMS_BASE_URL: "${CHINA_CUSTOMS_BASE_URL:-https://online.customs.gov.cn/ociswebserver}"
      # Legacy aliases remain supported for existing deployments.
      AMAZON_API_ENDPOINT: "${AMAZON_API_ENDPOINT:-}"
      AMAZON_API_KEY: "${AMAZON_API_KEY:-}"
      SHOPEE_API_ENDPOINT: "${SHOPEE_API_ENDPOINT:-}"
      SHOPEE_API_KEY: "${SHOPEE_API_KEY:-}"
      ALIEXPRESS_API_ENDPOINT: "${ALIEXPRESS_API_ENDPOINT:-}"
      ALIEXPRESS_API_KEY: "${ALIEXPRESS_API_KEY:-}"
      EBAY_API_ENDPOINT: "${EBAY_API_ENDPOINT:-}"
      EBAY_API_KEY: "${EBAY_API_KEY:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      ANN_BACKEND: "${ANN_BACKEND:-disabled}"
      RECALL_ARCHITECTURE: "${RECALL_ARCHITECTURE:-dual}"
      ANN_INDEX_PATH: "${COMPOSE_ANN_INDEX_PATH:-/app/data/item_index.faiss}"
      TOWER_USER_ENDPOINT: "${TOWER_USER_ENDPOINT:-}"
      TOWER_QUERY_ENDPOINT: "${COMPOSE_TOWER_QUERY_ENDPOINT:-http://embedding:8090/embed}"
      TOWER_ITEM_ENDPOINT: "${TOWER_ITEM_ENDPOINT:-}"
      # Host development uses RERANKER_ENDPOINT; containers must use their service DNS name.
      RERANKER_ENDPOINT: "${COMPOSE_RERANKER_ENDPOINT:-}"
      COMPRESS_KEEP_RECENT: "${COMPRESS_KEEP_RECENT:-3}"
      COMPRESS_MAX_TOKENS: "${COMPRESS_MAX_TOKENS:-12000}"
      AGENT_MAX_FORK_DEPTH: "${AGENT_MAX_FORK_DEPTH:-2}"
      AGENT_MAX_CHILDREN: "${AGENT_MAX_CHILDREN:-4}"
      AGENT_MAX_CONCURRENT_CHILDREN: "${AGENT_MAX_CONCURRENT_CHILDREN:-8}"
      AGENT_CHILD_TIMEOUT_SECONDS: "${AGENT_CHILD_TIMEOUT_SECONDS:-90}"
      AGENT_MAX_TOOL_CALLS: "${AGENT_MAX_TOOL_CALLS:-24}"
      AGENT_TOOL_RESULT_CHARS: "${AGENT_TOOL_RESULT_CHARS:-16000}"
      AGENT_LOOP_DETECTION_THRESHOLD: "${AGENT_LOOP_DETECTION_THRESHOLD:-4}"
      LLM_TOKEN_BUDGET: "${LLM_TOKEN_BUDGET:-12000}"
      LLM_LITE_TOKEN_THRESHOLD: "${LLM_LITE_TOKEN_THRESHOLD:-8000}"
      LLM_MINIMAL_TOKEN_THRESHOLD: "${LLM_MINIMAL_TOKEN_THRESHOLD:-4000}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_BASE_URL: "${LANGFUSE_BASE_URL:-}"
      LANGFUSE_HOST: "${LANGFUSE_HOST:-}"
      LANGFUSE_TRACING_ENABLED: "${LANGFUSE_TRACING_ENABLED:-true}"
      LANGFUSE_TRACING_ENVIRONMENT: "${LANGFUSE_TRACING_ENVIRONMENT:-development}"
      PROVIDER_TIMEOUT_SECONDS: "${PROVIDER_TIMEOUT_SECONDS:-15}"
      PROVIDER_RETRY_ATTEMPTS: "${PROVIDER_RETRY_ATTEMPTS:-2}"
      PROVIDER_RETRY_BACKOFF_SECONDS: "${PROVIDER_RETRY_BACKOFF_SECONDS:-0.2}"
      PROVIDER_RETRY_BACKOFF_MAX_SECONDS: "${PROVIDER_RETRY_BACKOFF_MAX_SECONDS:-2}"
      PROVIDER_CIRCUIT_FAILURE_THRESHOLD: "${PROVIDER_CIRCUIT_FAILURE_THRESHOLD:-5}"
      PROVIDER_CIRCUIT_WINDOW_SIZE: "${PROVIDER_CIRCUIT_WINDOW_SIZE:-20}"
      PROVIDER_CIRCUIT_FAILURE_RATE: "${PROVIDER_CIRCUIT_FAILURE_RATE:-0.5}"
      PROVIDER_CIRCUIT_RESET_SECONDS: "${PROVIDER_CIRCUIT_RESET_SECONDS:-30}"
      PROVIDER_MAX_CONCURRENCY: "${PROVIDER_MAX_CONCURRENCY:-4}"
      TASK_TIMEOUT_SECONDS: "${TASK_TIMEOUT_SECONDS:-180}"
      RECALL_TIMEOUT_SECONDS: "${RECALL_TIMEOUT_SECONDS:-10}"
      RERANK_TIMEOUT_SECONDS: "${RERANK_TIMEOUT_SECONDS:-10}"
      MAX_CONCURRENT_TASKS: "${MAX_CONCURRENT_TASKS:-8}"
      AUTH_ENABLED: "${AUTH_ENABLED:-false}"
      AUTH_USER_HEADER: "${AUTH_USER_HEADER:-X-Auth-User}"
      AUTH_TENANT_HEADER: "${AUTH_TENANT_HEADER:-X-Auth-Tenant}"
      AUTH_SIGNATURE_HEADER: "${AUTH_SIGNATURE_HEADER:-X-Auth-Signature}"
      AUTH_SHARED_SECRET: "${AUTH_SHARED_SECRET:-}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-false}"
      RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:-120}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      SHUTDOWN_GRACE_SECONDS: "${SHUTDOWN_GRACE_SECONDS:-15}"
      RELEASE_CHANNEL: "${RELEASE_CHANNEL:-stable}"
      RELEASE_ID: "${RELEASE_ID:-local}"
      RELEASE_TRAFFIC_PERCENT: "${RELEASE_TRAFFIC_PERCENT:-100}"
      RELEASE_ROLLBACK: "${RELEASE_ROLLBACK:-false}"
      TASK_RETENTION_SECONDS: "${TASK_RETENTION_SECONDS:-86400}"
      PREFERENCE_TTL_SECONDS: "${PREFERENCE_TTL_SECONDS:-31536000}"
      UPLOAD_MAX_BYTES: "${UPLOAD_MAX_BYTES:-8388608}"
      OUTPUT_ROOT: /app/output
      UPLOAD_ROOT: /app/uploaded
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      WS_PING_INTERVAL: "${WS_PING_INTERVAL:-20}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - shopping_agent_output:/app/output
      - shopping_agent_uploaded:/app/uploaded
      - shopping_agent_data:/app/data
      - ./data/product_index/electronics-hash:/app/data/product_index/electronics-hash:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      embedding:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/api/readiness', timeout=3)); raise SystemExit(0 if data.get('task_ready') else 1)"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - shopping_agent

  frontend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shopping_agent

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  reranker_models:
  shopping_agent_output:
  shopping_agent_uploaded:
  shopping_agent_data:
  embedding_models:

networks:
  shopping_agent:
    driver: bridge
