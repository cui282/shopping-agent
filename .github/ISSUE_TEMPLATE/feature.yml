name: Feature request
description: Propose a focused product or engineering improvement.
title: "feature: "
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operator problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: State what should become possible and how success can be verified.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and provider dependencies
      description: Note API contracts, data sources, security boundaries, or compatibility requirements.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
