name: Bug report
description: Report a reproducible defect in the API, workflow, or interface.
title: "bug: "
labels: [needs-triage]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest sequence that reproduces the problem.
      placeholder: |
        1. Configure ...
        2. Start ...
        3. Submit ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime mode
      options:
        - Live
        - Sandbox
        - Not ready
        - Unknown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Revision
      description: Commit SHA or release version.
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Include request IDs, provider status, logs, or screenshots after removing secrets and personal data.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed API keys, authorization headers, and personal data.
          required: true
        - label: I searched existing issues for the same behavior.
          required: true
